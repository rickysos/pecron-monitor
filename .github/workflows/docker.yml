name: Docker

# Publishes the container to Docker Hub:
#   - tag v* pushes  -> <user>/pecron-monitor:<version>  (e.g. v0.9.0 -> 0.9.0)
#   - pushes to main -> <user>/pecron-monitor:latest + <user>/pecron-monitor:sha-<short-sha>
#
# One-time repo setup (Settings -> Secrets and variables -> Actions):
#   Variables:  DOCKERHUB_USERNAME = <your docker hub user>
#   Secrets:    DOCKERHUB_TOKEN    = <access token with push scope>

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    # secrets are not shared with pull requests from forks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/pecron-monitor
          tags: |
            type=ref,event=tag,pattern=v(?P<version>.*)
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.repository_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
